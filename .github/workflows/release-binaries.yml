name: Release Binaries

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag（留空则自动 build-<run_number>）"
        required: false
        default: ""
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            goarch: amd64
            goarm: ""
            suffix: amd64
          - arch: arm64
            goarch: arm64
            goarm: ""
            suffix: arm64
          # armv7（32 位）暂时编不了：bytedance/sonic v1.14 不支持 32 位架构
          # 如需 32 位，得把 util/json 改成 build tag 走 encoding/json 回退
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build (${{ matrix.suffix }})
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          GOPROXY: https://goproxy.cn,direct
        run: |
          set -euo pipefail
          OUT="pansou-${{ matrix.suffix }}"
          go build -trimpath -ldflags "-s -w" -o "$OUT" .
          chmod +x "$OUT"
          ls -l "$OUT"
          sha256sum "$OUT" > "$OUT.sha256"
          cat "$OUT.sha256"
          # 前端托管 + API 反代（cmd/webproxy，零依赖）
          WP="pansou-webproxy-${{ matrix.suffix }}"
          go build -trimpath -ldflags "-s -w" -o "$WP" ./cmd/webproxy
          chmod +x "$WP"
          sha256sum "$WP" > "$WP.sha256"
          ls -l "$WP"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pansou-${{ matrix.suffix }}
          path: |
            pansou-${{ matrix.suffix }}
            pansou-${{ matrix.suffix }}.sha256
            pansou-webproxy-${{ matrix.suffix }}
            pansou-webproxy-${{ matrix.suffix }}.sha256
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Show files
        run: ls -lh dist

      - name: Resolve tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=build-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create / update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: PanSou 二进制 ${{ steps.tag.outputs.tag }}
          body: |
            PanSou 后端二进制（由 GitHub Actions 从源码编译，纯 Go、CGO 关闭、静态链接）

            | 文件 | 适用 |
            |---|---|
            | `pansou-arm64` | 后端本体，手机 / 电视 / ARM64（**WebHTV 实验室用这个**） |
            | `pansou-webproxy-arm64` | 前端托管 + `/api` 反代（配 `pansou-web-dist.zip` 用） |
            | `pansou-amd64` | x86_64 服务器 / NAS |

            用法（两个进程）：
            ```
            PORT=8888 ./pansou-arm64 &
            LISTEN=:8080 WEB_ROOT=./dist API_UPSTREAM=http://127.0.0.1:8888 ./pansou-webproxy-arm64 &
            # 浏览器开 http://127.0.0.1:8080
            ```

            只跑 API：`PORT=8888 ./pansou-arm64`（可选环境变量 CHANNELS / ENABLED_PLUGINS / PROXY / CACHE_PATH 等，与官方一致）

            提交：`${{ github.sha }}`
          files: |
            dist/*
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
